<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1c1814">
  <title>Teleprompter — IEEE EDUCON</title>
  <style>
    /* ── Reset ─────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Root variables ─────────────────────────────── */
    :root {
      --bg:        #f2ede4;
      --bg2:       #e8e0d4;
      --bg3:       #ddd5c8;
      --ink:       #1c1814;
      --ink2:      #5a4a38;
      --ink3:      #7a6a58;
      --gold:      #e8a030;
      --gold-dark: #b07820;
      --bar:       #1c1814;

      --fs-base:   1.08rem;
      --lh:        1.9;
    }

    /* ── Base ───────────────────────────────────────── */
    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      touch-action: pan-y;
    }

    /* ── App shell ──────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;         /* iOS 15.4+ */
      height: -webkit-fill-available; /* older iOS fallback */
      overflow: hidden;
      /* safe area for notch / home bar */
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── Top bar ────────────────────────────────────── */
    #topbar {
      flex-shrink: 0;
      background: var(--bar);
      padding: 10px 14px;
      padding-top: calc(10px + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    #topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-label {
      background: var(--gold);
      color: var(--ink);
      font-family: 'Courier New', Courier, monospace;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 3px 7px;
      border-radius: 3px;
    }

    #counter {
      font-family: 'Courier New', Courier, monospace;
      font-size: 18px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -0.5px;
    }

    #counter span {
      color: #665a4a;
      font-size: 13px;
      font-weight: 400;
    }

    #topbar-right {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .ctrl-btn {
      background: transparent;
      border: 1px solid #3a3028;
      color: #a08060;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 4px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-appearance: none;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.15s, color 0.15s;
      min-width: 36px;
      text-align: center;
    }

    .ctrl-btn.active {
      background: var(--gold);
      color: var(--ink);
      border-color: var(--gold);
    }

    /* ── Progress bar ───────────────────────────────── */
    #progress-track {
      flex-shrink: 0;
      height: 4px;
      background: var(--bg3);
    }

    #progress-fill {
      height: 100%;
      background: var(--gold);
      transition: width 0.3s ease;
    }

    /* ── Slide badge ────────────────────────────────── */
    #slide-badge {
      flex-shrink: 0;
      background: var(--gold);
      padding: 8px 18px 7px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    #slide-num {
      font-family: 'Courier New', Courier, monospace;
      font-size: 30px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1;
    }

    #slide-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.2px;
    }

    #slide-time {
      margin-left: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      font-weight: 700;
      color: #5a3a10;
    }

    /* ── Scroll content ─────────────────────────────── */
    #content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 16px 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── TR box ─────────────────────────────────────── */
    #tr-box {
      background: var(--bg2);
      border: 1px solid var(--bg3);
      border-radius: 8px;
      padding: 10px 14px;
      line-height: 1.55;
      color: var(--ink2);
      display: none;
    }

    #tr-box.visible {
      display: block;
    }

    #tr-label {
      color: var(--gold-dark);
      font-size: 10px;
      letter-spacing: 1.5px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
    }

    /* ── Script ─────────────────────────────────────── */
    #script {
      line-height: var(--lh);
      color: var(--ink);
      font-size: var(--fs-base);
      flex: 1;
    }

    /* ── Pronunciation ──────────────────────────────── */
    #pron-section {
      margin-top: auto;
    }

    #pron-toggle {
      background: transparent;
      border: 1px solid var(--bg3);
      color: var(--ink3);
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      letter-spacing: 1px;
      padding: 6px 11px;
      border-radius: 4px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-appearance: none;
      user-select: none;
      -webkit-user-select: none;
      display: block;
      transition: background 0.15s;
    }

    #pron-toggle.open {
      background: var(--bg3);
    }

    #pron-list {
      display: none;
      background: var(--bg2);
      border: 1px solid var(--bg3);
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 8px;
      flex-direction: column;
      gap: 8px;
    }

    #pron-list.visible {
      display: flex;
    }

    .pron-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .pron-word {
      font-weight: 700;
      color: var(--ink);
      min-width: 150px;
      flex-shrink: 0;
    }

    .pron-ph {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      color: var(--gold-dark);
    }

    /* ── Navigation ─────────────────────────────────── */
    #nav {
      flex-shrink: 0;
      background: var(--bg2);
      border-top: 1px solid var(--bg3);
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr 2fr 52px;
      gap: 8px;
    }

    .nav-btn {
      background: var(--bg3);
      border: 1px solid #b8b0a0;
      color: #3a2c1e;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 13px 8px;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-appearance: none;
      user-select: none;
      -webkit-user-select: none;
      text-align: center;
      transition: opacity 0.15s, background 0.15s;
      -webkit-user-select: none;
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    #btn-next {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    #btn-next:disabled {
      background: var(--bg3);
      color: #8a7a6a;
      border-color: #b8b0a0;
    }

    /* Active press states for touch */
    .nav-btn:active:not(:disabled) {
      opacity: 0.75;
    }

    .ctrl-btn:active {
      opacity: 0.7;
    }

    /* ── Swipe hint (first load only) ───────────────── */
    #swipe-hint {
      position: fixed;
      bottom: calc(80px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(28,24,20,0.75);
      color: #f2ede4;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      animation: hint-fade 3s ease 1.5s forwards;
    }

    @keyframes hint-fade {
      0%   { opacity: 0; transform: translateX(-50%) translateY(4px); }
      20%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Top bar -->
  <div id="topbar">
    <div id="topbar-left">
      <span class="badge-label">TELEPROMPTER</span>
      <span id="counter">1<span> / 19</span></span>
    </div>
    <div id="topbar-right">
      <button class="ctrl-btn" id="btn-smaller" onclick="changeFont(-1)" aria-label="Küçük font">A–</button>
      <button class="ctrl-btn" id="btn-bigger"  onclick="changeFont(1)"  aria-label="Büyük font">A+</button>
      <button class="ctrl-btn" id="btn-tr"      onclick="toggleTR()"     aria-label="Türkçe">TR</button>
    </div>
  </div>

  <!-- Progress -->
  <div id="progress-track">
    <div id="progress-fill" style="width: 5.26%"></div>
  </div>

  <!-- Slide badge -->
  <div id="slide-badge">
    <span id="slide-num">1</span>
    <span id="slide-title">Title</span>
    <span id="slide-time">~30 sn</span>
  </div>

  <!-- Scrollable content -->
  <div id="content">
    <div id="tr-box">
      <span id="tr-label">TÜRKÇE ▸ </span>
      <span id="tr-text"></span>
    </div>
    <div id="script"></div>
    <div id="pron-section">
      <button id="pron-toggle" onclick="togglePron()">▼ ZOR KELİMELER</button>
      <div id="pron-list"></div>
    </div>
  </div>

  <!-- Navigation -->
  <div id="nav">
    <button class="nav-btn" id="btn-prev"   onclick="go(-1)">← GERİ</button>
    <button class="nav-btn" id="btn-next"   onclick="go(1)">İLERİ →</button>
    <button class="nav-btn" id="btn-reset"  onclick="reset()">↺</button>
  </div>
</div>

<div id="swipe-hint">← kaydır / sağa kaydır →</div>

<script>
/* ── Slide data ─────────────────────────────────────── */
const SLIDES = [
  {
    id: 1, title: "Title", time: "~30 sn",
    tr: "Kendinizi tanıtın. Başlığı söyleyin ve co-author'ı belirtin.",
    script: "Hello everyone. My name is Emre Çoban. I am a PhD student at Rey Juan Carlos University in Spain, and I am also a lecturer at Ardahan University in Türkiye. Today, I will present our study: AI Code Feedback for Introductory Programming Education. This study was done together with my co-author, Raquel Belén Hijón Neira.",
    hard: [["introductory","in-trı-DAK-tı-ri"],["conducted","kın-DAK-tid"]]
  },
  {
    id: 2, title: "Agenda", time: "~20 sn",
    tr: "Sunumun sırasını çok kısa özetle.",
    script: "First, I will explain the background and the problem. Then, I will talk about related studies and the Technology Acceptance Model. After that, I will show our tool, explain the method, and share the results and conclusions.",
    hard: [["methodology","me-tı-DOL-ı-ci"]]
  },
  {
    id: 3, title: "Background & Context", time: "~30 sn",
    tr: "Öğrenciler zorlanıyor → anında geri bildirim lazım → yapay zeka fırsat sunuyor.",
    script: "Python is one of the most popular languages for learning programming. But beginners often struggle with syntax and debugging. They need regular and instant support. In large classes, teachers cannot help every student all the time. This is where AI creates a new opportunity — it can give instant and personal feedback.",
    hard: [["generative","CEN-ı-rı-tiv"],["personalized","PÖR-sı-nıl-ayzd"]]
  },
  {
    id: 4, title: "Context Switching", time: "~30 sn",
    tr: "Öğrenci VS Code'dan tarayıcıya gidiyor → dikkat bozuluyor → biz bunu VS Code içine taşıdık.",
    script: "This slide shows the main problem. Many students leave VS Code, open a browser, ask AI in a chat window, and then return to their code. This breaks their attention and interrupts the learning process. Our idea is simple: bring the feedback directly into the coding environment.",
    hard: [["interrupts","in-tı-RAPTS"],["environment","en-VAY-rın-mınt"]]
  },
  {
    id: 5, title: "Problem & Research Questions", time: "~35 sn",
    tr: "Problem: akışı kesmeden geri bildirim. Sorular: başarı, kavram, cinsiyet, kabul.",
    script: "Our main problem is: how can we give AI feedback inside the coding environment without breaking the learner's workflow? Based on this, we asked — does the AI extension improve Python learning more than standard VS Code? Do the gains change across concepts? Are there gender differences? And how do students accept the technology?",
    hard: [["whether","WEDH-ır"],["acceptance","ık-SEP-tıns"]]
  },
  {
    id: 6, title: "AI in General Fields", time: "~25 sn",
    tr: "Yapay zeka birçok alanda kullanılıyor. Ama gizlilik ve güven gibi kaygılar da var.",
    script: "AI helpers are already used in many fields — healthcare, education, business, and social care. They support people with guidance and daily tasks. But important concerns also remain: privacy, trust, security, and data governance.",
    hard: [["governance","GAV-ır-nıns"],["motivation","moh-tı-VEY-şın"]]
  },
  {
    id: 7, title: "AI in Programming Education", time: "~30 sn",
    tr: "Yapay zeka hata tespiti ve kişisel destek sunabilir. Ama IDE dışında çalışıyor — bu boşluğu biz hedefledik.",
    script: "In programming education, AI tools can explain code, detect errors, and give personal support for novice learners. They can help students understand difficult concepts. However, many of these tools still work outside the IDE. This is the gap we wanted to address with our study.",
    hard: [["novice","NOV-is"],["address","ı-DRES"]]
  },
  {
    id: 8, title: "Technology Acceptance Model (TAM)", time: "~25 sn",
    tr: "TAM'ı çok teorik anlatma. Öğrencilerin teknolojiyi nasıl kabul ettiğini anlamak için kullandık.",
    script: "We also used the Technology Acceptance Model — or TAM. This model helps us understand how users accept a technology. In our study, we used it for looking at perceived usefulness, social norm, behavioral intention, attitude toward use, and actual use of the AI extension.",
    hard: [["perceived","pır-SİVD"],["behavioral","bi-HEY-vyı-rıl"],["intention","in-TEN-şın"]]
  },
  {
    id: 9, title: "The Tool: How It Works", time: "~30 sn",
    tr: "Öğrenci yazar → imleç durur → uzantı kodu alır → yapay zekaya gönderir → sidebar'da geri bildirim.",
    script: "The student writes code in VS Code. When the cursor stays idle for a short time — or when code is selected — the extension sends that code to the AI model. Then, the feedback appears directly in the sidebar panel. No switching, no extra steps.",
    hard: [["extension","eks-TEN-şın"],["processes","PROS-es-iz"]]
  },
  {
    id: 10, title: "Specifications", time: "~30 sn",
    tr: "Marketplace'ten kurulum. Otomatik veya manuel tetikleme. Birden fazla AI modeli. Ana dilde geri bildirim.",
    script: "The extension is installed from the VS Code Marketplace. It can start automatically after three seconds of idle time, or manually when code is selected. It supports different AI models — ChatGPT, Gemini, and Claude. Feedback can also be given in the student's native language: Turkish, Spanish, or English.",
    hard: [["automatically","o-tı-MAT-ik-li"],["triggered","TRİG-ırd"],["native","NEY-tiv"]]
  },
  {
    id: 11, title: "Key Features", time: "~25 sn",
    tr: "Ana vurgu: anında geri bildirim, bağlam değiştirmeme, prompt gerekmemesi, ana dil desteği.",
    script: "The main benefit is that feedback is instant and stays inside the same workspace. Students do not need to switch to another platform, and they do not need to write prompts. This is especially helpful for beginners. Feedback in the native language can also reduce cognitive load.",
    hard: [["cognitive","KOG-ni-tiv"],["manually","MAN-yu-ıl-i"]]
  },
  {
    id: 12, title: "Experimental Design", time: "~35 sn",
    tr: "Yarı deneysel, ön test–son test, tek oturum. Deney: uzantı kullandı. Kontrol: standart VS Code.",
    script: "Our study used a quasi-experimental pre-test and post-test design. Both groups completed a Python test, then worked on a task in VS Code. The experimental group used the AI extension, while the control group used standard VS Code. After the activity, both groups took the post-test and completed the TAM scale.",
    hard: [["quasi-experimental","KVEY-zi eks-per-i-MEN-tıl"],["practical","PRAK-ti-kıl"]]
  },
  {
    id: 13, title: "Participants", time: "~30 sn",
    tr: "Ardahan Üniversitesi, 1. sınıf öğrencileri. 41 veri → 30 geçerli. 13 kontrol, 17 deney.",
    script: "Participants were first-year students from the Computer Programming department at Ardahan University in Türkiye. Participation was voluntary, and all data were kept private. We collected 41 responses. After removing duplicates, 30 valid cases remained: 13 in the control group, and 17 in the experimental group.",
    hard: [["participants","par-TİS-i-pınts"],["inconsistent","in-kın-SİS-tınt"]]
  },
  {
    id: 14, title: "Results: Learning Outcomes", time: "~35 sn",
    tr: "Her iki grup da gelişti. Ama gruplar arası fark istatistiksel olarak anlamlı değil.",
    script: "Both groups improved significantly from pre-test to post-test. The control group went from 3.85 to 5.38, and the experimental group from 4.24 to 6.24. However, the overall difference between the two groups was not statistically significant.",
    hard: [["significantly","sig-NİF-i-kınt-li"],["statistically","stı-TİS-tik-li"]]
  },
  {
    id: 15, title: "Results: Concept Map", time: "~30 sn",
    tr: "Deney: Strings ve Variables & Casting'de gelişti. Kontrol: yalnızca Variables & Casting. I/O'da değişim yok.",
    script: "When we look at individual concepts, we see a clearer picture. The experimental group improved in Strings and in Variables and Casting. The control group improved only in Variables and Casting. For Input and Output, neither group showed significant change.",
    hard: [["individual","in-di-VİC-yu-ıl"],["significant","sig-NİF-i-kınt"]]
  },
  {
    id: 16, title: "Results: TAM & Gender", time: "~35 sn",
    tr: "TAM: gruplar arası anlamlı fark yok. Deney grubu düşük ve değişken puan. Erkekler: Variables. Kadınlar: Strings.",
    script: "For technology acceptance, we did not find significant differences between the groups. The experimental group showed lower TAM scores and higher variability — students did not all respond to the tool in the same way. We also saw gender-based differences: male students improved mainly in Variables and Casting, while female students improved mainly in Strings.",
    hard: [["variability","vey-ri-ı-BİL-i-ti"],["statistically","stı-TİS-tik-li"]]
  },
  {
    id: 17, title: "Conclusions & Future Work", time: "~40 sn",
    tr: "Her iki grup gelişti ama AI üstün değil. Strings'te etkisi var. Katılım önemli. Gelecek: onboarding, uzun çalışma, adaptif geri bildirim.",
    script: "To sum up: both groups improved, but the AI tool did not produce clearly better overall results. Still, it seems to have helped with Strings — which may suggest a form of personal feedback. One key point: AI only works when students really use it. In future work, we plan to improve onboarding, run longer studies, and explore more adaptive feedback.",
    hard: [["engagement","en-GEYC-mınt"],["adaptive","ı-DAP-tiv"],["effectiveness","i-FEK-tiv-nis"]]
  },
  {
    id: 18, title: "Key Takeaway", time: "~30 sn",
    tr: "Ana mesajın bu. Yavaş ve güvenli söyle. Pause yap.",
    script: "The key takeaway is simple: AI feedback works — but only when students actually engage with it. The success of AI in education is not only about the tool. It is also about trust, usability, and how students use it in real learning situations.",
    hard: [["takeaway","TEYK-ı-wey"],["usability","yu-zı-BİL-i-ti"]]
  },
  {
    id: 19, title: "Questions & Discussion", time: "~15 sn",
    tr: "Teşekkür et. Sorulara açık olduğunu söyle. Gülümse.",
    script: "Thank you very much for listening. I would be happy to answer your questions and discuss the study further.",
    hard: []
  }
];

/* ── State ──────────────────────────────────────────── */
let current   = 0;
let showTR    = false;
let showPron  = false;
const FS_STEPS = ["0.90rem","1.08rem","1.28rem","1.52rem"];
let fsIndex   = 1;

/* ── DOM refs ───────────────────────────────────────── */
const $counter   = document.getElementById('counter');
const $fill      = document.getElementById('progress-fill');
const $slideNum  = document.getElementById('slide-num');
const $slideTitle= document.getElementById('slide-title');
const $slideTime = document.getElementById('slide-time');
const $trBox     = document.getElementById('tr-box');
const $trText    = document.getElementById('tr-text');
const $script    = document.getElementById('script');
const $pronSec   = document.getElementById('pron-section');
const $pronToggle= document.getElementById('pron-toggle');
const $pronList  = document.getElementById('pron-list');
const $btnPrev   = document.getElementById('btn-prev');
const $btnNext   = document.getElementById('btn-next');
const $btnTR     = document.getElementById('btn-tr');
const $content   = document.getElementById('content');

/* ── Render ─────────────────────────────────────────── */
function render() {
  const s   = SLIDES[current];
  const pct = ((current + 1) / SLIDES.length * 100).toFixed(2);

  $counter.innerHTML   = `${current + 1}<span> / ${SLIDES.length}</span>`;
  $fill.style.width    = pct + '%';
  $slideNum.textContent  = s.id;
  $slideTitle.textContent= s.title;
  $slideTime.textContent = s.time;
  $trText.textContent    = s.tr;
  $script.textContent    = s.script;

  /* pronunciation */
  if (s.hard.length > 0) {
    $pronSec.style.display = 'block';
    $pronList.innerHTML = s.hard.map(([w,p]) =>
      `<div class="pron-row">
        <span class="pron-word" style="font-size:${FS_STEPS[fsIndex]}">${w}</span>
        <span class="pron-ph"   style="font-size:${FS_STEPS[fsIndex]}">${p}</span>
      </div>`
    ).join('');
  } else {
    $pronSec.style.display = 'none';
    showPron = false;
  }

  /* pron toggle state */
  $pronList.classList.toggle('visible', showPron);
  $pronToggle.classList.toggle('open', showPron);
  $pronToggle.textContent = showPron ? '▲ TELAFFUZ GİZLE' : '▼ ZOR KELİMELER';

  /* TR state */
  $trBox.classList.toggle('visible', showTR);
  $btnTR.classList.toggle('active', showTR);

  /* nav buttons */
  $btnPrev.disabled = (current === 0);
  $btnNext.disabled = (current === SLIDES.length - 1);

  /* font size */
  $script.style.fontSize   = FS_STEPS[fsIndex];
  $trBox.style.fontSize     = `calc(${FS_STEPS[fsIndex]} * 0.82)`;
  $script.style.lineHeight  = '1.9';

  /* scroll to top on slide change */
  $content.scrollTop = 0;
}

/* ── Actions ────────────────────────────────────────── */
function go(dir) {
  const next = current + dir;
  if (next < 0 || next >= SLIDES.length) return;
  current  = next;
  showPron = false;
  render();
}

function reset() {
  current  = 0;
  showPron = false;
  render();
}

function toggleTR()   { showTR   = !showTR;   render(); }
function togglePron() { showPron = !showPron;  render(); }

function changeFont(dir) {
  fsIndex = Math.max(0, Math.min(FS_STEPS.length - 1, fsIndex + dir));
  render();
}

/* ── Keyboard (for desktop testing) ────────────────── */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft')                    { e.preventDefault(); go(-1); }
});

/* ── Touch swipe ────────────────────────────────────── */
let touchStartX = null;
let touchStartY = null;

document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  /* only register horizontal swipes (dx dominant, > 50px) */
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) go(1);   /* swipe left  → next */
    else        go(-1);  /* swipe right → prev */
  }
  touchStartX = null;
  touchStartY = null;
}, { passive: true });

/* ── Init ───────────────────────────────────────────── */
render();
</script>
</body>
</html>
